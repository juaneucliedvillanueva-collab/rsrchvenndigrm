<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puzzle</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #faf9f6;
    font-family: Arial, sans-serif;
    padding: 20px;
}

.game {
    width: min(100%, 420px);
    text-align: center;
}

#puzzle {
    width: 100%;
    aspect-ratio: 1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
    padding: 4px;
    background: #dedbd4;
    border-radius: 10px;
    overflow: hidden;
}

.tile {
    border: 0;
    padding: 0;
    min-width: 0;
    min-height: 0;
    background-repeat: no-repeat;
    cursor: pointer;
    border-radius: 3px;
}

.empty {
    background: #faf9f6 !important;
    cursor: default;
}

button#shuffle {
    margin-top: 18px;
    padding: 12px 28px;
    border: 0;
    border-radius: 25px;
    background: #f3b63f;
    color: #292929;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

#message {
    font-size: 14px;
    color: #555;
    margin-top: 15px;
}
</style>
</head>

<body>

<div class="game">
    <div id="puzzle"></div>
    <button id="shuffle">Shuffle</button>
    <p id="message">Loading picture...</p>
</div>

<script>
// CHANGE THIS to your image's exact filename.
const IMAGE = "./volleyball.png";

const puzzle = document.getElementById("puzzle");
const message = document.getElementById("message");

let pieces = [0,1,2,3,4,5,6,7,8];
let solved = true;
let imageReady = false;

// Load the fixed image once.
const picture = new Image();

picture.onload = () => {
    imageReady = true;
    showPuzzle();
    message.textContent = "Press Shuffle to play!";
};

picture.onerror = () => {
    message.textContent =
        "Image not found. Check the image filename and folder.";
};

picture.src = IMAGE;

function showPuzzle() {
    puzzle.innerHTML = "";

    // Display the complete picture after solving.
    if (solved && imageReady) {
        puzzle.style.display = "block";
        puzzle.style.padding = "0";
        puzzle.style.background =
            `url("${IMAGE}") center / 100% 100% no-repeat`;
        return;
    }

    puzzle.style.display = "grid";
    puzzle.style.padding = "4px";
    puzzle.style.background = "#dedbd4";

    pieces.forEach((piece, index) => {
        const tile = document.createElement("button");
        tile.className = "tile";

        if (piece === 8) {
            tile.classList.add("empty");
            tile.disabled = true;
        } else {
            const x = piece % 3;
            const y = Math.floor(piece / 3);

            tile.style.backgroundImage = `url("${IMAGE}")`;
            tile.style.backgroundSize = "300% 300%";
            tile.style.backgroundPosition =
                `${x * 50}% ${y * 50}%`;

            tile.onclick = () => move(index);
        }

        puzzle.appendChild(tile);
    });
}

function move(index) {
    if (solved) return;

    const empty = pieces.indexOf(8);

    const sameRow =
        Math.floor(index / 3) === Math.floor(empty / 3);

    const nextToEmpty =
        Math.abs(index - empty) === 3 ||
        (sameRow && Math.abs(index - empty) === 1);

    if (!nextToEmpty) return;

    [pieces[index], pieces[empty]] =
        [pieces[empty], pieces[index]];

    solved = pieces.every((p, i) => p === i);

    showPuzzle();

    message.textContent = solved
        ? "You solved it! 🏐"
        : "Keep going!";
}

function shuffle() {
    if (!imageReady) {
        message.textContent = "The picture hasn't loaded yet.";
        return;
    }

    pieces = [0,1,2,3,4,5,6,7,8];

    let empty = 8;
    let previous = -1;

    // Shuffle with legal moves so the puzzle is solvable.
    for (let i = 0; i < 100; i++) {
        const options = [];
        const row = Math.floor(empty / 3);
        const col = empty % 3;

        if (row > 0) options.push(empty - 3);
        if (row < 2) options.push(empty + 3);
        if (col > 0) options.push(empty - 1);
        if (col < 2) options.push(empty + 1);

        const valid = options.filter(n => n !== previous);
        const next = valid[Math.floor(Math.random() * valid.length)];

        [pieces[empty], pieces[next]] =
            [pieces[next], pieces[empty]];

        previous = empty;
        empty = next;
    }

    if (pieces.every((p, i) => p === i)) {
        return shuffle();
    }

    solved = false;
    showPuzzle();
    message.textContent = "Put the picture back together!";
}

document.getElementById("shuffle").onclick = shuffle;
</script>

</body>
</html>
