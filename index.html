<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sliding Puzzle</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #faf9f6;
    font-family: Arial, sans-serif;
}

.game {
    width: 100%;
    max-width: 420px;
    text-align: center;
}

#puzzle {
    width: 100%;
    aspect-ratio: 1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
    padding: 4px;
    background: #dedbd4;
    border-radius: 10px;
    overflow: hidden;
}

.tile {
    min-width: 0;
    min-height: 0;
    border: none;
    border-radius: 4px;
    padding: 0;
    background-repeat: no-repeat;
    cursor: pointer;
}

.empty {
    background: #faf9f6 !important;
    cursor: default;
}

#shuffle {
    margin-top: 18px;
    padding: 12px 28px;
    border: none;
    border-radius: 25px;
    background: #f3b63f;
    color: #292929;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

#message {
    margin-top: 15px;
    font-size: 14px;
    color: #555;
}
</style>
</head>

<body>

<div class="game">
    <div id="puzzle"></div>

    <button id="shuffle">Shuffle</button>

    <p id="message">Loading puzzle...</p>
</div>

<script>
// Your fixed image must be in the same folder as index.html.
const IMAGE = "./volleyball.png";

const puzzle = document.getElementById("puzzle");
const message = document.getElementById("message");

let pieces = [0,1,2,3,4,5,6,7,8];
let solved = false;
let imageReady = false;

const picture = new Image();

picture.onload = () => {
    imageReady = true;
    shuffle();
};

picture.onerror = () => {
    message.textContent =
        "Image not found. Check the filename and repository folder.";
};

picture.src = IMAGE;

function isSolved() {
    return pieces.every((piece, index) => piece === index);
}

function draw() {
    puzzle.innerHTML = "";

    if (solved) {
        puzzle.style.display = "block";
        puzzle.style.padding = "0";
        puzzle.style.background =
            `url("${IMAGE}") center / 100% 100% no-repeat`;
        return;
    }

    puzzle.style.display = "grid";
    puzzle.style.padding = "4px";
    puzzle.style.background = "#dedbd4";

    pieces.forEach((piece, index) => {
        const tile = document.createElement("button");
        tile.className = "tile";

        if (piece === 8) {
            tile.classList.add("empty");
            tile.disabled = true;
        } else {
            const x = piece % 3;
            const y = Math.floor(piece / 3);

            tile.style.backgroundImage = `url("${IMAGE}")`;
            tile.style.backgroundSize = "300% 300%";
            tile.style.backgroundPosition =
                `${x * 50}% ${y * 50}%`;

            tile.addEventListener("click", () => move(index));
        }

        puzzle.appendChild(tile);
    });
}

function move(index) {
    if (solved || !imageReady) return;

    const empty = pieces.indexOf(8);

    const sameRow =
        Math.floor(index / 3) === Math.floor(empty / 3);

    const adjacent =
        Math.abs(index - empty) === 3 ||
        (sameRow && Math.abs(index - empty) === 1);

    if (!adjacent) return;

    [pieces[index], pieces[empty]] =
        [pieces[empty], pieces[index]];

    solved = isSolved();

    draw();

    message.textContent = solved
        ? "You solved it! 🏐"
        : "Keep going!";
}

function shuffle() {
    if (!imageReady) {
        message.textContent = "Loading picture...";
        return;
    }

    pieces = [0,1,2,3,4,5,6,7,8];

    let empty = 8;
    let previous = -1;

    // Mix the puzzle using legal moves.
    for (let i = 0; i < 100; i++) {
        const options = [];
        const row = Math.floor(empty / 3);
        const col = empty % 3;

        if (row > 0) options.push(empty - 3);
        if (row < 2) options.push(empty + 3);
        if (col > 0) options.push(empty - 1);
        if (col < 2) options.push(empty + 1);

        const available = options.filter(
            position => position !== previous
        );

        const next = available[
            Math.floor(Math.random() * available.length)
        ];

        [pieces[empty], pieces[next]] =
            [pieces[next], pieces[empty]];

        previous = empty;
        empty = next;
    }

    if (isSolved()) return shuffle();

    solved = false;
    draw();
    message.textContent = "Put the picture back together!";
}

document.getElementById("shuffle")
    .addEventListener("click", shuffle);
</script>

</body>
</html>
